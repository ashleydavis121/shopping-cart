<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Modern Notepad Shop - Stylish Design</title>
  <style>
    * { box-sizing: border-box; }
    body {font-family: 'Helvetica Neue', sans-serif; background: #000; margin: 0;}

    .header-footer {
      position: relative;
      overflow: hidden;
      color: white;
      padding: 50px 30px;
      text-align: center;
      border-top: 5px solid #1c1c43;
      border-bottom: 5px solid #211841;
    }

    .header-footer h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 1px;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 8px #fff, 0 0 12px #ffd700;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 8px #fff, 0 0 12px #ffd700; }
      100% { text-shadow: 0 0 15px #fff, 0 0 25px #ffd700; }
    }

    .container {width: 90%; max-width: 1400px; margin: 40px auto; padding: 20px;}
    .product-list {display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;}
    .product {border-radius: 16px; padding: 20px; text-align: center; transition: transform 0.3s, box-shadow 0.3s; background: linear-gradient(145deg, #f3f6fc, #e0f7fa); border: 2px solid #3f51b5;}
    .product:hover {transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.2);}
    .product img {width: 100%; border-radius: 12px; margin-bottom: 10px;}
    .product h3 {margin: 8px 0; font-size: 16px; color: #3f51b5;}
    .product p.desc {font-size: 13px; color: #555; margin-bottom: 8px;}
    .price {font-size: 15px; color: #1a237e; font-weight: bold; margin-bottom: 8px;}
    button {background: #2196f3; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;}
    button:hover {background: #1976d2;}
    .cart {margin-top: 30px; background: linear-gradient(145deg, #f3f6fc, #e0f7fa); padding: 20px; border-radius: 16px; box-shadow: 0 0 15px rgba(0,0,0,0.1), inset 0 0 10px rgba(0,0,0,0.05); border: 2px solid #3f51b5;}
    .cart h3 {color: #3f51b5; margin-bottom: 10px;}
    .cart-item {border-bottom: 1px solid #cfd8dc; padding: 8px 0; display: flex; justify-content: space-between; align-items: center;}
    .cart-item span {font-size: 14px;}
    .cart-item button {background: #f44336; padding: 5px 10px; font-size: 12px; border-radius: 6px;}
    .cart-item button:hover {background: #d32f2f;}
    .total {font-weight: bold; text-align: right; margin-top: 12px; font-size: 16px; color: #1a237e;}

    .quantity {width: 50px; text-align: center; margin-right: 6px;}
    .clear-cart {margin-top: 10px; background: #ff9800;}
    .clear-cart:hover {background: #f57c00;}
    .checkout {margin-top: 10px; background: #4caf50;}
    .checkout:hover {background: #388e3c;}

    canvas {position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;}
  </style>
</head>
<body>
  <header class="header-footer">
    <canvas id="starCanvasHeader"></canvas>
    <h1>Modern Notepad Shop - Stylish Design</h1>
  </header>
  <div class="container">
    <div class="product-list" id="productList"></div>
    <div class="cart" id="cart"></div>
    <button class="checkout" onclick="checkoutCart()">Checkout with PayPal</button>
    <button class="clear-cart" onclick="clearCart()">Clear Cart</button>
  </div>
  <footer class="header-footer">
    <canvas id="starCanvasFooter"></canvas>
    <h1>Thank You for Visiting Our Shop</h1>
  </footer>

  <script>
    const totalNotepads = 1000;
    const products = [];

    for(let i=1; i<=totalNotepads; i++){
      products.push({
        id: 'notepad-'+i,
        name: 'Lined Notepad '+i,
        price: (2.99 + (i%10)*0.1).toFixed(2),
        image: 'https://via.placeholder.com/200x150/64b5f6/ffffff?text=Notepad+'+i,
        desc: 'Write your own text, notes, or ideas here.'
      });
    }

    let cart = {};
    const productList = document.getElementById('productList');
    const cartDiv = document.getElementById('cart');

    function formatCurrency(value) {
      return value.toLocaleString('en-GB', { style: 'currency', currency: 'GBP' });
    }

    function renderProducts() {
      productList.innerHTML = products.map(p => `
        <div class="product">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="desc">${p.desc}</p>
          <p class="price">${formatCurrency(parseFloat(p.price))}</p>
          <input type='number' class='quantity' id='qty-${p.id}' value='1' min='1'>
          <button onclick="addToCart('${p.id}')">Add to Cart</button>
        </div>`).join('');
    }

    function addToCart(id) {
      const qty = parseInt(document.getElementById('qty-' + id).value);
      cart[id] = (cart[id] || 0) + qty;
      renderCart();
    }

    function removeFromCart(id) {
      delete cart[id];
      renderCart();
    }

    function clearCart() {
      cart = {};
      renderCart();
    }

    function checkoutCart() {
      const total = Object.keys(cart).reduce((sum, key) => {
        const p = products.find(pr => pr.id === key);
        return sum + parseFloat(p.price) * cart[key];
      }, 0);

      const paypalUrl = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=ashleydavis1001@outlook.com&item_name=Notepad+Order&amount=${total.toFixed(2)}&currency_code=GBP`;

      window.open(paypalUrl, '_blank');
    }

    function renderCart() {
      const items = Object.keys(cart).map(key => {
        const p = products.find(pr => pr.id === key);
        return `<div class='cart-item'><span>${p.name} x${cart[key]}</span><button onclick="removeFromCart('${key}')">Remove</button></div>`;
      }).join('');

      const total = Object.keys(cart).reduce((sum, key) => {
        const p = products.find(pr => pr.id === key);
        return sum + parseFloat(p.price) * cart[key];
      }, 0);

      cartDiv.innerHTML = `<h3>Your Cart</h3>${items || '<p>No items yet.</p>'}<div class='total'>Total: ${formatCurrency(total)}</div>`;
    }

    renderProducts();
    renderCart();
  </script>
<script>
  function createGalaxyStars(canvasId, starCount = 150, shootingCount = 10) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    // Static stars
    const stars = [];
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.5 + 0.2
      });
    }

    // Shooting stars
    const shootingStars = [];
    for (let i = 0; i < shootingCount; i++) {
      shootingStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height / 2,
        length: Math.random() * 100 + 30,
        speed: Math.random() * 7 + 3
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw static stars
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        s.x -= s.speed;
        if (s.x < 0) s.x = canvas.width;
      });

      // Draw shooting stars
      shootingStars.forEach(sh => {
        ctx.beginPath();
        ctx.moveTo(sh.x, sh.y);
        ctx.lineTo(sh.x - sh.length, sh.y + sh.length / 4);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();

        sh.x -= sh.speed;
        sh.y += sh.speed / 4;
        if (sh.x < 0 || sh.y > canvas.height) {
          sh.x = Math.random() * canvas.width;
          sh.y = Math.random() * canvas.height / 2;
          sh.length = Math.random() * 100 + 30;
          sh.speed = Math.random() * 7 + 3;
        }
      });

      requestAnimationFrame(animate);
    }

    animate();

    // Resize canvas when window resizes
    window.addEventListener('resize', () => {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    });
  }

  // Apply to header and footer
  createGalaxyStars('starCanvasHeader', 150, 10);
  createGalaxyStars('starCanvasFooter', 150, 10);
</script>


</body>
</html>
